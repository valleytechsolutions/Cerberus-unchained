name: Build Unchained firmware candidate

# Produces a candidate artifact for review. It never flashes hardware, changes the
# selected web release, or publishes a production release automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install the pinned build tool
        run: python -m pip install platformio==6.1.19
      - name: Resolve dependencies and generate effective target configurations
        # A clean runner has no sdkconfig.<environment> files. Build these once
        # before the matched receipt is taken; the final gate then detects any
        # later input/output changes instead of accepting stale build metadata.
        run: |
          python tools/build_unchained.py --target s3
          python tools/build_unchained.py --target c5
          python tools/build_unchained.py --target bridge
          python -m platformio run -d expansion/c5_scanner -e c5-expansion-wroom
          python -m platformio run -d expansion/c5_scanner -e c5-expansion-xiao
      - name: Verify all five targets and native console boundaries
        run: python tools/build_unified.py --target all
      - name: Build and package the unchanged matched set
        run: python tools/build_unchained.py --target all --package
      - name: Verify the package and produce its ZIP
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          packages = [p for p in Path('dist').iterdir() if p.is_dir()]
          if len(packages) != 1:
              raise SystemExit('Expected exactly one newly built firmware package')
          package = packages[0]
          subprocess.run([sys.executable, 'tools/export_web_release.py', str(package), '--verify-only'], check=True)
          archive = Path(shutil.make_archive(str(package), 'zip', root_dir=package.parent, base_dir=package.name))
          sha256 = hashlib.sha256(archive.read_bytes()).hexdigest()
          Path(str(archive) + '.sha256').write_text(f'{sha256}  {archive.name}\n', encoding='utf-8')
          print(f'Candidate package: {archive.name}')
          print(f'SHA-256: {sha256}')
          PY
      - name: Save firmware candidate for review
        uses: actions/upload-artifact@v7
        with:
          name: cerberus-unchained-candidate-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cerberus-unchained-build-diagnostics-${{ github.run_number }}
          path: |
            artifacts/build/
            artifacts/integration/
          if-no-files-found: ignore
          retention-days: 7
